name: CI

on:
  push:
  pull_request:

jobs:
  conformance:
    name: Conformance harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harness dependencies
        working-directory: conformance
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      # check.py runs the suite in-process and asserts the verdict counts, the
      # failing row set, and every row's refusal code against the committed
      # baseline. run.py alone exits 0 whatever the rows do — the three failures
      # (N3, N11, M1) are expected — so it cannot detect a row flipping.
      # A failure here means the profile's behaviour moved.
      - name: Check conformance against recorded state
        working-directory: conformance
        run: |
          set -euo pipefail
          python3 src/check.py

      # Every .sha256 file lists a bare filename, so each is checked from its
      # own directory. The interop fixtures are the PSEA side of candidate
      # cross-runs: if their bytes drift silently the other implementation
      # recomputes against something we are no longer publishing.
      #
      # The interop-nep pin was added with the fixture but not to this step, so
      # it was recorded and never checked for one commit. Every .sha256 in
      # conformance/ is listed here; adding a pin without adding it here leaves
      # a file that looks verified and is not.
      - name: Verify recorded digests
        working-directory: conformance
        run: |
          set -euo pipefail
          sha256sum -c results/RESULTS.sha256
          ( cd interop-aae && sha256sum -c psea-fixture-v0.sha256 )
          ( cd interop-nep && sha256sum -c psea-nep-fixture-v0.sha256 )

  drafts:
    name: Draft build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xml2rfc
        run: python3 -m pip install --disable-pip-version-check xml2rfc

      # Builds to a scratch directory so the checked-in artifacts under drafts/
      # are never rewritten by CI. xml2rfc exits non-zero on error; warnings
      # (artwork width, over-long lines) do not fail the build.
      #
      # idnits is deliberately NOT run here yet. It emits ~60 line-length
      # warnings from the JSON Schema block of draft-yossif-psea-02 and would
      # fail every run. Add it once those are resolved in a future revision.
      - name: Build every draft
        run: |
          set -euo pipefail
          mkdir -p /tmp/draft-build
          shopt -s nullglob
          found=0
          for xml in drafts/*/*.xml; do
            found=1
            echo "::group::xml2rfc --text $xml"
            xml2rfc --text "$xml" -o "/tmp/draft-build/$(basename "${xml%.xml}").txt"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No draft XML found under drafts/*/*.xml" >&2
            exit 1
          fi
